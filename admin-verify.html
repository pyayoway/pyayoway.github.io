<!doctype html>
<html lang="my">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Cache-Control" content="no-store"><title>PYAY OWAY — Email အတည်ပြုရန်</title>
<style>body{background:#f3f7f1;color:#172f20;font:16px/1.8 system-ui,sans-serif;display:grid;place-items:center;min-height:95vh;margin:0;padding:20px;box-sizing:border-box}main{max-width:460px;width:100%;background:white;border-radius:22px;padding:30px;box-sizing:border-box;box-shadow:0 8px 28px #19382119}h1{font-size:25px;margin:0 0 16px}#msg{font-size:17px}.ok{color:#137943}.err{color:#aa3528}small{color:#617269}a{color:#2c6b3c}</style>
</head><body><main><h1>PYAY OWAY Admin</h1><p id="msg" role="status">Email ကို စစ်ဆေးအတည်ပြုနေပါသည်…</p><small>Email အတည်ပြုပြီးပါက Admin App သို့ ပြန်သွားပြီး “အတည်ပြုပြီးပြီ” ကိုနှိပ်ပါ။</small><p><a href="/">PYAY OWAY Website</a></p></main>
<script>
(async () => {
 const params=new URLSearchParams(location.search);
 const userId=params.get('userId'); const secret=params.get('secret');
 history.replaceState(null,'',location.pathname);
 const node=document.getElementById('msg');
 if (!userId || !secret){node.textContent='အတည်ပြုလင့်ခ် မပြည့်စုံပါ။ App ထဲမှ Email အသစ်ပြန်ပို့ပါ။';node.className='err';return;}
 try{
   const response=await fetch('https://sgp.cloud.appwrite.io/v1/account/verification',{
     method:'PUT',mode:'cors',credentials:'omit',cache:'no-store',
     headers:{'Content-Type':'application/json','X-Appwrite-Project':'6a9dc0470000dc913bad'},
     body:JSON.stringify({userId,secret}),
   });
   if(!response.ok) throw new Error('VERIFICATION_FAILED');
   node.className='ok';node.textContent='✓ Email အတည်ပြုပြီးပါပြီ။ Admin App သို့ ပြန်သွားပါ။';
 }catch(_){node.className='err';node.textContent='Email အတည်ပြု၍ မရပါ။ လင့်ခ်သက်တမ်းကုန်/အသုံးပြုပြီးသား ဖြစ်နိုင်သည်။ App မှ Email အသစ်ပြန်ပို့ပါ။';}
})();
</script></body></html>
